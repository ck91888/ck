# Independent staging only. D1 ID verified against the user's staging screenshot.
# Never substitute the existing ck_v2 production database ID here.
# Dedicated Workers Builds service: ck-v2-api-sop-staging (test branch only).
name = "ck-v2-api-sop-staging"
main = "staging-reset-entry.js"
compatibility_date = "2026-03-03"

# Workers Builds runs: node worker-v2/build-sop-staging.mjs from repository root.
# Do not run a second custom build with a different working directory.

[assets]
directory = "./.sop-staging-assets"
run_worker_first = ["/api", "/api/*", "/file"]

[vars]
SOP_TEST_RESET_RUN = "ck-staging-clear-test-data-20260921"
SOP_TEST_RESET_DATABASE = "ba1eba33-bcdd-4de2-8927-d37dc3788396"
SOP_UPGRADE_ENABLED = "true"
SOP_ACCEPT_NEW = "true"
SOP_AUTO_OUTBOUND = "true"
SOP_ROLLOUT_DEPARTMENTS = "bulk"
SOP_ENVIRONMENT = "staging"
SOP_ATTENDANCE_ENABLED = "true"
# Explicitly authorized public, fictional-data acceptance environment only.
SOP_PUBLIC_TEST_ACCESS = "true"

[[d1_databases]]
binding = "DB"
database_name = "ck_v2_sop_staging"
database_id = "ba1eba33-bcdd-4de2-8927-d37dc3788396"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "ck-v2-sop-staging-files"
